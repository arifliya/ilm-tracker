server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors what the backend already gets for free from helmet() — this
    # service had none of it. `always` so the headers still go out on
    # nginx's own error responses (4xx/5xx), not just successful ones.
    #
    # connect-src is deliberately not locked to 'self': the frontend and
    # backend are different origins in every real deployment of this app
    # (VITE_API_URL points at a separate host:port, see api.ts) and this
    # static nginx.conf has no way to know that origin at request time. If
    # you want this tightened to the exact API origin, switch this file to
    # nginx's template mechanism (COPY it to
    # /etc/nginx/templates/default.conf.template and reference an
    # envsubst'd ${API_ORIGIN} here) rather than loosening it further.
    #
    # style-src needs 'unsafe-inline' because this app uses React's
    # style={{...}} inline styles throughout rather than CSS classes —
    # tightening that would mean migrating every component's styling, not
    # a header change.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only honored by the browser once the response actually arrives over
    # HTTPS (e.g. via a TLS-terminating proxy in front of this container)
    # — harmless to send unconditionally otherwise, per the HSTS spec.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # React Router owns every non-file path — fall back to index.html so
    # direct navigation/refresh on routes like /login or /dashboard don't
    # hit a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
