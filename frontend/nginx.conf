server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns every non-file path — fall back to index.html so
    # direct navigation/refresh on routes like /login or /dashboard don't
    # hit a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
