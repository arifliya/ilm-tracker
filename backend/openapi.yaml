                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        class_name:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getFeesClasses
  '/fees/fee-periods/{id}/fees':
    get:
      tags:
        - Fees
      summary: List every student's fee row for a period
      description: |-
        Admin and treasurer only. Gated by `fees`. Every student at the
        school is returned even if this period hasn't been generated for
        them yet (fee_id/amount/status/paid_at come back null in that case).
        `class_name` is a comma-separated list, not a single class — a
        student can belong to more than one class (e.g. a form class plus
        an after-school club).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Fee period and per-student fee rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  feePeriod:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  fees:
                    type: array
                    items:
                      type: object
                      properties:
                        student_id:
                          type: integer
                        student_first_name:
                          type: string
                        student_surname:
                          type: string
                        class_name:
                          type: string
                          nullable: true
                        fee_id:
                          type: integer
                          nullable: true
                        amount:
                          type: number
                          nullable: true
                        status:
                          type: string
                          enum: [unpaid, paid, pending_collection, failed]
                          nullable: true
                        payment_method:
                          type: string
                          enum: [manual, direct_debit]
                          nullable: true
                        failure_reason:
                          type: string
                          nullable: true
                        paid_at:
                          type: string
                          format: date-time
                          nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getFeesFeePeriodsFeesById
  '/fees/fee-periods/{id}/generate':
    post:
      tags:
        - Fees
      summary: Bulk-generate fees for a period, per class
      description: |-
        Admin and treasurer only. Gated by `fees`. Takes one amount per
        class (see `GET /fees/classes`), entered fresh for this call —
        not a persistent rate. A student's fee is the SUM of the amounts
        for every class they belong to (a student can be in more than
        one, e.g. a form class plus an after-school club — each
        membership adds to their total); a student in none of the given
        classes gets no row at all. Only amounts for classes that
        actually belong to the caller's school are honored.

        Idempotent — a student who already has a row for this period is
        left untouched (their amount is not overwritten, and a paid row
        stays paid); only students missing a row get one inserted.

        Also gated by `direct_debit` (in addition to `fees`): if enabled,
        any row inserted by this call (not a pre-existing one) for a
        student whose parent has an active direct-debit mandate is
        immediately submitted for collection (`payment_method` becomes
        `direct_debit`, `status` becomes `pending_collection`) instead of
        staying manual/unpaid. This only happens at generation time — a
        mandate that becomes active afterward does not retroactively
        submit fees generated before it existed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amounts
              properties:
                amounts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - class_id
                      - amount
                    properties:
                      class_id:
                        type: integer
                      amount:
                        type: number
      responses:
        '200':
          description: Fees generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  affectedRows:
                    type: integer
                  submittedForCollection:
                    type: integer
                    description: Of the newly-inserted rows, how many were auto-submitted for direct-debit collection.
        '400':
          description: Missing/empty amounts, an invalid class_id or amount, or none of the given classes belong to this school
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postFeesFeePeriodsGenerateById
  '/fees/fees/{feeId}':
    put:
      tags:
        - Fees
      summary: Edit a student's fee amount
      description: Admin and treasurer only. Gated by `fees`. Only allowed while the fee is still `unpaid` — blocked once it's `paid` or `pending_collection` (already submitted to the direct-debit provider at its current amount).
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          description: Invalid amount, or the fee is already paid or pending direct-debit collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: putFeesFeesByFeeId
  '/fees/fees/{feeId}/mark-paid':
    post:
      tags:
        - Fees
      summary: Mark a fee as paid
      description: Admin and treasurer only. Gated by `fees`.
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postFeesFeesMarkPaidByFeeId
  '/fees/fees/{feeId}/mark-unpaid':
    post:
      tags:
        - Fees
      summary: Mark a fee as unpaid
      description: Admin and treasurer only. Gated by `fees`. Corrects a mistaken mark-as-paid, and also resets `payment_method`/`provider_payment_id`/`failure_reason` back to a plain manual fee (it will not be auto-resubmitted — that only happens at fee-generation time).
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postFeesFeesMarkUnpaidByFeeId
  '/fees/fees/{feeId}/simulate-collection':
    post:
      tags:
        - Fees
      summary: Simulate a provider webhook for a fee awaiting collection
      description: |-
        Admin and treasurer only. Gated by `fees`. Stub-payment-provider
        test harness — moves a fee from `pending_collection` to `paid` or
        `failed` without a real provider webhook call, using the exact
        same transition logic `POST /fees/webhooks/direct-debit` uses.
        Only valid while the fee is `pending_collection`. Meaningful while
        running against the stub provider (see
        `backend/src/utils/directDebitProvider.ts`); expected to be
        removed or repurposed once a real provider is wired in.
      parameters:
        - name: feeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - outcome
              properties:
                outcome:
                  type: string
                  enum: [paid, failed]
                failure_reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          description: Invalid outcome, or the fee isn't awaiting direct-debit collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Fee record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postFeesFeesSimulateCollectionByFeeId
  /fees/webhooks/direct-debit:
    post:
      tags:
        - Fees
      summary: Direct-debit provider webhook — payment outcome
      description: |-
        Unauthenticated (no session cookie applies to a server-to-server
        callback) — instead signature-verified via an HMAC-SHA256 of the
        raw request body in the `X-Signature` header, checked against
        `DIRECT_DEBIT_WEBHOOK_SECRET`. Idempotent: a duplicate/replayed
        event for an already-settled fee, or an unrecognized
        `provider_payment_id`, is acknowledged with `200` and does
        nothing, since providers retry webhook delivery and this route
        has to be safe to call more than once for the same event. Not
        gated by any feature flag — a payment already submitted before a
        flag was disabled must still be able to settle.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_payment_id
                - event
              properties:
                provider_payment_id:
                  type: string
                event:
                  type: string
                  enum: [paid, failed]
                failure_reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postFeesWebhooksDirectDebit
  /parent/direct-debit/mandate:
    get:
      tags:
        - Parent
      summary: Get the caller's own direct-debit mandate status
      description: Parent only. Gated by `direct_debit`.
      responses:
        '200':
          description: The parent's mandate, or null if never set up
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandate:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum: [pending, active, cancelled]
                      created_at:
                        type: string
                        format: date-time
                      cancelled_at:
                        type: string
                        format: date-time
                        nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getParentDirectDebitMandate
    post:
      tags:
        - Parent
      summary: Self-serve set up (or re-set-up) a direct-debit mandate
      description: |-
        Parent only. Gated by `direct_debit`. Creates the mandate via the
        configured payment provider (currently a stub — no real bank
        details ever touch this app) and stores it active. If the parent
        previously cancelled a mandate, this reactivates the same row with
        fresh provider IDs rather than creating a second one — there is
        only ever one mandate per parent (`payment_mandates.parent_id` is
        unique).
      responses:
        '200':
          description: An existing cancelled mandate was reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '201':
          description: A new mandate was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A mandate is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postParentDirectDebitMandate
  /parent/direct-debit/mandate/cancel:
    post:
      tags:
        - Parent
      summary: Cancel the caller's own direct-debit mandate
      description: Parent only. Gated by `direct_debit`. Does not affect fees already `pending_collection` under the mandate — those still settle via the provider webhook.
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active mandate to cancel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postParentDirectDebitMandateCancel
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly JWT set by POST /auth/login. See the top-level description for session lifetime/refresh/revocation behavior.
  parameters:
    ClassId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    MessageOk:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Unauthorized:
      description: No/invalid/expired/revoked session cookie
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Forbidden:
      description: 'Authenticated, but not permitted (wrong role, or outside the caller''s school)'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    NotFound:
      description: 'Not found, or exists but outside the caller''s school scope (schools are never distinguished from truly-missing, to avoid leaking existence across tenants)'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    PoolStats:
      type: object
      description: Snapshot of the DB connection pool's current utilization.
      properties:
        activeConnections:
          type: integer
          example: 2
        totalConnections:
          type: integer
          description: Physical connections opened so far (capped at connectionLimit).
          example: 4
        connectionLimit:
          type: integer
          example: 10
        enqueuedCount:
          type: integer
          description: Cumulative count of requests that had to wait for a free connection since process start.
          example: 0
    RoleName:
      type: string
      enum:
        - system_admin
        - owner
        - maintainer
        - admin
        - teacher
        - parent
        - student
        - staff
        - pending
    JwtUser:
      type: object
      description: 'The decoded JWT payload, attached to every authenticated response that echoes the caller''s identity'
      properties:
        userId:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        schoolId:
          type: integer
          nullable: true
          description: null only for system_admin
        tokenVersion:
          type: integer
        iat:
          type: integer
          description: Unix timestamp
        exp:
          type: integer
          description: Unix timestamp
    Class:
      type: object
      properties:
        id:
          type: integer
        class_name:
          type: string
        year_group:
          type: string
    ClassWithSchool:
      allOf:
        - $ref: '#/components/schemas/Class'
        - type: object
          properties:
            school_id:
              type: integer
            school_name:
              type: string
            school_code:
              type: string
            class_code:
              type: string
            description:
              type: string
              nullable: true
    School:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        school_code:
          type: string
        created_at:
          type: string
          format: date-time
    FeatureFlag:
      type: object
      properties:
        id:
          type: integer
        feature_key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        default_enabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FeatureFlagAuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        feature_flag_id:
          type: integer
          nullable: true
          description: Null once the flag itself has been deleted — feature_key is kept so the entry stays readable.
        feature_key:
          type: string
        school_id:
          type: integer
          nullable: true
          description: Null for platform-wide actions (create/update/delete a flag); set for per-school override actions.
        school_name:
          type: string
          nullable: true
        action:
          type: string
          enum: [flag_created, flag_updated, flag_deleted, school_override_set, school_override_cleared]
        actor_user_id:
          type: integer
          nullable: true
        actor_username:
          type: string
        details:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
    ChildSummary:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        surname:
          type: string
        gender:
          type: string
        date_of_birth:
          type: string
          format: date
        guardian_code:
          type: string
          description: Share this with a second guardian so they can self-request linking via POST /parent/link-guardian
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
    TaskWithChildName:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            child_name:
              type: string
            is_independent:
              type: boolean
    Notification:
      type: object
      properties:
        id:
          type: integer
        audience:
          type: string
          enum:
            - parent
            - staff
        title:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
    NotificationInbox:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            read_at:
              type: string
              format: date-time
              nullable: true
            sender_first_name:
              type: string
            sender_last_name:
              type: string
    FullUserDetails:
      type: object
      description: One row from GET /admin/users-all — fields are populated from parents or staff_details depending on role; student rows have no details (Option C).
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        school_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        address3:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        medical_condition:
          type: string
          nullable: true
        disability:
          type: string
          nullable: true
          description: Staff roles only
        students:
          type: array
          description: Populated for parent users only
          items:
            type: object
            properties:
              id:
                type: integer
              first_name:
                type: string
              surname:
                type: string
              address1:
                type: string
                nullable: true
