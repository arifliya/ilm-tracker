version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ilm_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ilm
      MYSQL_USER: ilmuser
      MYSQL_PASSWORD: ilmpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    command: ["--default-authentication-plugin=mysql_native_password"]

  backend:
    build: ./backend
    container_name: ilm_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: ilm_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
